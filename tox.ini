[tox]
envlist =
    py3{12,13,14}{,-oldestdeps,-cov}
    {lint,typecheck,docs,wheel}{,-oldestdeps}
requires =
    tox-uv
isolated_build = true

# The test jobs only run the test environments. lint, typecheck, docs and wheel give
# the same result on every OS, so the `checks` job of tests.yml runs them once, on Ubuntu.
#
# Each of them also has an -oldestdeps variant, which uses the lowest versions that
# pyproject.toml allows, so that the minimum versions it declares are checked and not
# just assumed to work. The -oldestdeps variants of the test environments do the same
# for the runtime dependencies and the test extra.
[gh]
python =
    3.12 = py312{-cov,-oldestdeps}
    3.13 = py313{-cov,-oldestdeps}
    3.14 = py314{-cov,-oldestdeps}

# Run the main test suite
[testenv]
set_env =

    # Set platform
    PLATFORM = unknown
    linux: PLATFORM = linux
    darwin: PLATFORM = mac
    win32: PLATFORM = windows

allowlist_externals =
    echo
description =
    run tests
    oldestdeps: with the lowest compatible direct dependencies
    cov: with coverage
uv_resolution =
    !oldestdeps: highest
    oldestdeps: lowest-direct
extras =
    test
commands =

    echo Running on {env:PLATFORM}

    {list_dependencies_command}

    # Run tests
    pytest \
    cov: --cov --cov-branch --cov-fail-under=100 --cov-report=xml:{env:PLATFORM}-{envname}-coverage.xml \
    cov: --junitxml={env:PLATFORM}-{envname}-junit.xml -o junit_family=legacy \
    {posargs}

# Run lint
[testenv:lint{,-oldestdeps}]
description =
    run linters and check the formatting
    oldestdeps: with the lowest compatible direct dependencies
extras =
    test-ruff
commands =
    ruff check {posargs}
    ruff format --check --diff

# Type check the package (and the tests) with mypy
[testenv:typecheck{,-oldestdeps}]
description =
    type check with mypy
    oldestdeps: with the lowest compatible direct dependencies
# The tests import pytest, so it has to be installed for the tests to be type checked
extras =
    test
    test-mypy
commands = mypy {posargs}

# Check the contents of the built wheel: it must contain exactly the files of the
# convolve_uv package, apart from the tests, which are deliberately left out. The metadata
# is checked too, by tools/check_wheel.py: the license text must be shipped, and the version
# must be found under the package's own name and not be the placeholder. CITATION.cff is
# validated and compared with pyproject.toml here as well.
[testenv:wheel{,-oldestdeps}]
description =
    check the built wheel contains exactly the package files (and not the tests)
    oldestdeps: built with the lowest build requirements that pyproject.toml allows
# tox does not expand globs or environment variables in commands, and {env:TOX_PACKAGE} is
# empty at that point (and check-wheel-contents passes silently when given no wheel), so
# build the wheel into a known directory here and check that directory instead.
package = skip
# The tools in deps are not the project's own requirements, so they are never lowered.
uv_resolution = highest
deps =
    build
    check-wheel-contents >= 0.6
    # CITATION.cff: cffconvert validates it, and check_citation.py reads it with PyYAML
    cffconvert
    pyyaml
extras =
# The package is compared with the files on disk, so ignore the tests (deliberately not
# shipped) and the bytecode caches and Finder files that other runs leave behind.
#
# setuptools keeps its build/ directory between builds and never deletes a file that has since
# been removed or renamed, so a leftover would be packed into the wheel. The first command starts
# from an empty build/ (it is only generated output; CI always starts without one).
#
# uv's lowest-direct resolution does not apply to a build's own requirements (uv build
# still picks the newest setuptools), so the oldest variant installs them itself: the
# [build-system] requires of pyproject.toml, at their lowest versions that are not yanked,
# so the floors are read from there and not written down a second time. It then builds
# without isolation, with those versions.
commands =
    python -c "import shutil; shutil.rmtree(r'{toxinidir}/build', ignore_errors=True)"
    oldestdeps: python -c "import pathlib, tomllib; requires = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['build-system']['requires']; pathlib.Path(r'{envtmpdir}/build-requires.txt').write_text(chr(10).join(requires))"
    oldestdeps: uv pip install --resolution lowest-direct --python {env_python} --requirement {envtmpdir}/build-requires.txt
    oldestdeps: python -c "import importlib.metadata as m; print('Building with setuptools', m.version('setuptools'), 'and setuptools_scm', m.version('setuptools_scm'))"
    oldestdeps: python -m build --no-isolation --wheel --outdir {envtmpdir}/dist
    !oldestdeps: python -m build --wheel --outdir {envtmpdir}/dist
    check-wheel-contents --package convolve_uv --package-omit tests,__pycache__,.DS_Store {envtmpdir}/dist
    python tools/check_wheel.py {envtmpdir}/dist
    # Zenodo and GitHub build their records from CITATION.cff, and quietly ignore an invalid one
    cffconvert --validate
    python tools/check_citation.py

# Build documentation
[testenv:docs{,-oldestdeps}]
changedir =
    docs
description =
    invoke sphinx-build to build docs, check links, report coverage
    oldestdeps: with the lowest compatible direct dependencies
extras =
    docs
commands =
    echo Building docs
    sphinx-build -W -b html . _build/html {posargs}
    echo Checking links
    sphinx-build -W -b linkcheck . _build/linkcheck {posargs}
    echo Checking coverage
    sphinx-build -W -b coverage . _build/coverage {posargs}
