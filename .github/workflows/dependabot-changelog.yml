name: Add Dependabot Changelog
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

# Default to read-only; the changelog job below narrowly escalates to
# contents: write only for the step that needs to push a commit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    # Dependabot PRs are opened from a branch on this repository (not a
    # fork), so the default GITHUB_TOKEN is writable for them. Restrict the
    # job to Dependabot-authored PRs so this elevated permission is never
    # exercised against arbitrary/fork pull requests.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository (only used as the fallback
      # when no DEPENDABOT_CHANGELOG_TOKEN secret is configured, see below).
      contents: write

    steps:
      # A commit pushed with the default GITHUB_TOKEN is made by github-actions[bot],
      # and the workflow runs it triggers are held at "action_required" until a
      # maintainer approves them, so the required checks never finish on their own.
      # Pushing with a token belonging to a real user avoids that. Dependabot
      # workflows can only read *Dependabot* secrets (Settings > Secrets and
      # variables > Dependabot), not Actions secrets. See
      # .github/DEPENDABOT_AUTO_MERGE.md for how to create the token.
      - name: Warn if no push token is configured
        env:
          TOKEN: ${{ secrets.DEPENDABOT_CHANGELOG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=No DEPENDABOT_CHANGELOG_TOKEN::Falling back to the default GITHUB_TOKEN. The CI runs for the changelog commit will wait for a maintainer to approve them."
          fi

      # Add changelog entry
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          # The git credentials set up here are what the commit action below pushes with
          token: ${{ secrets.DEPENDABOT_CHANGELOG_TOKEN || github.token }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true
      - uses: dangoslen/dependabot-changelog-helper@291c8cb629d7cd7b57ea065782c435ec2bedb138 # v4.3.0
        with:
          activationLabels: dependencies
          changelogPath: 'CHANGELOG.md'
          dependencyTool: dependabot
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Updated Changelog"
