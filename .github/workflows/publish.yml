name: Publish

on: [push, pull_request]

# Least-privilege default; the publish job below narrowly escalates to the
# id-token permission required for PyPI Trusted Publishing (OIDC).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress run for a tag push, so an in-flight release
  # publish can't be interrupted partway through.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-sdist-and-wheel:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build
        run: python -m pip install build twine
      - name: Build sdist
        run: python -m build --sdist --wheel --outdir dist/ .
      - name: Validate built artifacts
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  upload-pypi:
    name: Upload to PyPI
    needs: [build-sdist-and-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    # Restricts this job to the "pypi" GitHub Environment. Configure it under
    # repository Settings > Environments with a deployment protection rule
    # (e.g. "Deployment branches and tags" limited to `v*` tags) so only
    # genuine tag-triggered releases can reach PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/convolve_uv
    permissions:
      # Required for PyPI Trusted Publishing (OIDC); no long-lived API token
      # is used or needed. See:
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
