name: Publish

on: [push, pull_request]

# Least-privilege default; the publish job below narrowly escalates to the
# id-token permission required for PyPI Trusted Publishing (OIDC).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress run for a tag push, so an in-flight release
  # publish can't be interrupted partway through.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-sdist-and-wheel:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so setuptools_scm can work out the version.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install build
        run: python -m pip install build twine
      - name: Build sdist
        run: python -m build --sdist --wheel --outdir dist/ .
      - name: Validate built artifacts
        run: python -m twine check --strict dist/*
      - name: Check release tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          for artifact in dist/*.whl dist/*.tar.gz; do
            name="$(basename "$artifact")"
            name="${name%.tar.gz}"
            name="${name%.whl}"
            built_version="$(echo "$name" | cut -d- -f2)"
            if [ "$built_version" != "$tag_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match built version $built_version ($artifact)"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  # Run the full test matrix for release tags. upload-pypi depends on this, so
  # a failing test can never be published.
  tests:
    name: Run tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  upload-pypi:
    name: Upload to PyPI
    needs: [build-sdist-and-wheel, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    # Restricts this job to the "pypi" GitHub Environment. Configure it under
    # repository Settings > Environments with a deployment protection rule
    # (e.g. "Deployment branches and tags" limited to `v*` tags) so only
    # genuine tag-triggered releases can reach PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/convolve_uv
    permissions:
      # Required for PyPI Trusted Publishing (OIDC); no long-lived API token
      # is used or needed. See:
      # https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
