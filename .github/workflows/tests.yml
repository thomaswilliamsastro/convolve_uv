name: Test
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
      # run every Tuesday at 5am UTC
      - cron: '0 5 * * 2'
  workflow_dispatch:
  # Called by publish.yml on release tags, so the PyPI upload can depend on
  # these tests passing. Tags are deliberately not a direct trigger: that would
  # run the whole matrix twice for every release.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

# Least-privilege default: this workflow only runs tests and uploads
# coverage, it never needs to write to the repository.
permissions:
  contents: read

concurrency:
  # When called from another workflow, github.workflow is the *caller's* name,
  # so the "-tests-" infix keeps this group distinct from the caller's own
  # group. Without it, this cancel-in-progress group would match publish.yml's
  # and could cancel the release run.
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [
          macos-latest,
          ubuntu-latest,
          windows-latest,
        ]
        python-version: [
          "3.12",
          "3.13",
          "3.14",
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install tox
        # tox-uv must be installed alongside tox-gh: tox.ini lists it under
        # `requires`, and without it tox re-provisions itself in a fresh
        # environment that does not have tox-gh, so every matrix job runs
        # the entire envlist instead of just its own Python version.
        run: |
          uv tool install --python ${{ matrix.python-version }} tox --with tox-gh --with tox-uv
      - name: Run tests
        # tox-gh picks the tox environments from the `python` found on PATH,
        # which here is the runner's default interpreter rather than the
        # matrix version, so state the matrix version explicitly.
        env:
          TOX_GH_MAJOR_MINOR: ${{ matrix.python-version }}
        run: tox
      - name: Verify coverage and test reports were produced
        # Codecov silently uploads nothing if no report exists, so fail here
        # instead of letting coverage reporting quietly stop working.
        shell: bash
        run: |
          ls ./*-cov-coverage.xml ./*-cov-junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          report_type: "test_results"
          token: ${{ secrets.CODECOV_TOKEN }}

  test-status:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        if: needs.test.result != 'success'
        run: |
          echo "::error::One or more test matrix jobs did not succeed."
          exit 1
