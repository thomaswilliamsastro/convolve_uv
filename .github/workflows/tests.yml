name: Test
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
      # run every Tuesday at 5am UTC
      - cron: '0 5 * * 2'
  workflow_dispatch:

# Least-privilege default: this workflow only runs tests and uploads
# coverage, it never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [
          macos-latest,
          ubuntu-latest,
          windows-latest,
        ]
        python-version: [
          "3.12",
          "3.13",
          "3.14",
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install tox
        run: |
          uv tool install --python ${{ matrix.python-version }} tox --with tox-gh
      - name: Run tests
        run: tox
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          report_type: "test_results"
          token: ${{ secrets.CODECOV_TOKEN }}

  test-status:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        if: needs.test.result != 'success'
        run: |
          echo "::error::One or more test matrix jobs did not succeed."
          exit 1
