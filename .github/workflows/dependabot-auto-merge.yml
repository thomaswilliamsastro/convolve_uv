name: Dependabot Auto-Merge

# Enables GitHub's native auto-merge for Dependabot pull requests that are
# low-risk, and makes sure it is off for every other one (see the policy in the
# "Decide" step, and .github/DEPENDABOT_AUTO_MERGE.md).
#
# SECURITY NOTE: this workflow intentionally uses `pull_request`, not
# `pull_request_target`. It never checks out the pull request's code and
# never runs anything from the PR diff itself - it only calls the GitHub
# API (via `gh`) using metadata from the `github.event.pull_request`
# context. This keeps the default GITHUB_TOKEN scoped to the triggering
# ref's permissions and avoids the classic `pull_request_target` +
# "checkout PR head" privilege-escalation pattern.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

# Least-privilege default; the job below narrowly escalates only the two
# permissions actually required to enable/disable auto-merge.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # One run per PR. Do not cancel an in-flight run: it may be mid-way
  # through enabling or disabling auto-merge, and a duplicate run triggered
  # by a follow-up push (e.g. the changelog bot's commit, see
  # dependabot-changelog.yml) is cheap and idempotent, so letting both
  # finish in order is safer than cancelling a partially-applied change.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Enable auto-merge for low-risk updates
    runs-on: ubuntu-latest
    # Only ever act on Dependabot's own pull requests, and only while they
    # are open and targeting `main`. `pull_request.user.login` identifies
    # the PR *author* and cannot be spoofed by the PR's contents/diff, so
    # this is safe to check even though the job itself only uses
    # `pull_request` (not `pull_request_target`).
    #
    # Dependabot pull requests are opened from a branch on this repository
    # (not a fork), so `head.repo.full_name == base.repo.full_name` is
    # expected to always be true here. It is checked anyway as defense in
    # depth.
    #
    # The job deliberately runs for pushes by anyone, not only by Dependabot:
    # auto-merge merges whatever the branch head is, so every push has to be
    # re-checked (see "Decide").
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name

    permissions:
      # `gh pr merge --auto` uses the GraphQL `enablePullRequestAutoMerge`
      # mutation, which needs both of these.
      pull-requests: write
      contents: write

    steps:
      - name: Guard against closed/merged PRs
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_URL" --json state --jq .state)
          echo "PR state: $state"
          if [ "$state" != "OPEN" ]; then
            echo "Pull request is not open ($state); nothing to do."
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          fi

      # Reads the update details from Dependabot's *first* commit, which it
      # verifies is Dependabot's own and signed. It does not look at later
      # commits, which is why the "Decide" step checks them itself.
      - name: Fetch Dependabot metadata
        id: metadata
        if: steps.guard.outputs.should_continue == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Policy: auto-merge only patch and minor updates of Python *development*
      # dependencies, and only if EVERY dependency in the PR qualifies. Never
      # auto-merged: major updates, runtime dependencies (bumping their minimum
      # version changes what users of this library can install), and GitHub
      # Actions (third-party actions are pinned to commit SHAs so that updates
      # are a deliberate choice, which auto-merging would defeat).
      #
      # Commits after the first must be either Dependabot's own signed commits
      # or touch nothing but CHANGELOG.md (the changelog bot's commit). Anything
      # else, such as a stray push to the branch, makes the PR ineligible and
      # turns auto-merge off, because auto-merge would merge it unreviewed.
      - name: Decide whether the update is low-risk
        id: decide
        if: steps.guard.outputs.should_continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          reasons=()

          # 1. What is being updated
          if ! echo "${UPDATES:-}" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
            reasons+=("the Dependabot metadata could not be read (the first commit must be Dependabot's own, signed commit)")
            table="(none)"
          else
            table=$(echo "$UPDATES" | jq -r '.[] | "| \(.dependencyName) | \(.packageEcosystem) | \(.dependencyType) | \(.updateType | sub("version-update:semver-"; "")) |"')
            not_low_risk=$(echo "$UPDATES" | jq -r '
              .[]
              | select(
                  (.packageEcosystem == "pip"
                   and .dependencyType == "direct:development"
                   and (.updateType == "version-update:semver-patch"
                        or .updateType == "version-update:semver-minor"))
                  | not)
              | .dependencyName')
            if [ -n "$not_low_risk" ]; then
              reasons+=("not a patch/minor update of a Python development dependency: $(echo "$not_low_risk" | paste -sd, - | sed 's/,/, /g')")
            fi
          fi

          # 2. The commits on the branch (the first one is Dependabot's)
          commits=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | {sha: .sha, author: .author.login, verified: .commit.verification.verified}' | jq -s '.')
          for sha in $(echo "$commits" | jq -r '.[1:][] | select(.author != "dependabot[bot]" or .verified != true) | .sha'); do
            files=$(gh api "repos/$REPO/commits/$sha" --jq '[.files[].filename] | sort | join(",")')
            if [ "$files" != "CHANGELOG.md" ]; then
              reasons+=("commit ${sha:0:7} is not Dependabot's own and changes files other than CHANGELOG.md ($files)")
            fi
          done

          # 3. Result
          if [ ${#reasons[@]} -eq 0 ]; then
            eligible=true
            verdict="**Eligible for auto-merge**: a patch/minor update of Python development dependencies only."
          else
            eligible=false
            verdict="**Not eligible for auto-merge**, so it needs a manual review and merge:"
            for r in "${reasons[@]}"; do verdict+=$'\n'"- $r"; done
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          {
            echo "### Dependabot auto-merge decision"
            echo
            echo "$verdict"
            echo
            echo "| Dependency | Ecosystem | Type | Update |"
            echo "|---|---|---|---|"
            echo "$table"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "eligible=$eligible"

      # `gh pr merge --auto` only *enables* auto-merge; GitHub performs the
      # actual merge itself once every required check passes. It does not
      # bypass the ruleset, does not merge early, and is harmless if auto-merge
      # is already enabled.
      #
      # Uses squash merges to match this repository's single-commit-per-change
      # history. Change `--squash` below if the repository's merge method changes.
      - name: Enable auto-merge
        if: steps.guard.outputs.should_continue == 'true' && steps.decide.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --auto --squash

      # An earlier run may have enabled it (for example before Dependabot added
      # a major update to a group, or before an unexpected commit was pushed).
      - name: Make sure auto-merge is off
        if: steps.guard.outputs.should_continue == 'true' && steps.decide.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge "$PR_URL" --disable-auto
            echo "::warning title=Auto-merge disabled::This update is not eligible for auto-merge, so it was switched off. See the job summary."
          else
            echo "Auto-merge is not enabled; nothing to do."
          fi
