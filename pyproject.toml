[project]

name = "convolve_uv"
dynamic = ["version"]
description = "Perform Gaussian convolution directly in the uv-plane"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    {name = "Thomas Williams", email = "thomas.g.williams@manchester.ac.uk"},
]
maintainers = [
    {name = "Thomas Williams", email = "thomas.g.williams@manchester.ac.uk"},
]

classifiers = [
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "astropy >= 7.2.0",
    "numpy >= 2.3.5",
    "radio-beam >= 0.3.9",
    "spectral-cube >= 0.6.7",
]

# Optional packages for the test suite
[project.optional-dependencies]
test = [
    "pytest-cov >= 7.1.0",
]
test-ruff = [
    "ruff >= 0.15.10",
]

# Optional packages for documentation
docs = [
    "myst-parser >= 5.1.0",
    "sphinx >= 9.1.0",
    "sphinx-automodapi >= 0.22.0",
    "sphinx-rtd-theme >= 3.1.0",
]

[project.urls]
"Homepage" = "https://github.com/thomaswilliamsastro/convolve_uv"
"Bug Reports" = "https://github.com/thomaswilliamsastro/convolve_uv/issues"
"Source" = "https://github.com/thomaswilliamsastro/convolve_uv"

[build-system]
requires = [
    # 77 is the first release that supports PEP 639 license expressions
    "setuptools >= 77.0.1",
    "setuptools_scm >= 8.0",
]

build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Used when no git metadata is available (e.g. building from a GitHub source archive).
fallback_version = "0.0.0+unknown"
