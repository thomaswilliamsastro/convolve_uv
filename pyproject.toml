[project]

name = "convolve_uv"
dynamic = ["version"]
description = "Perform Gaussian convolution directly in the uv-plane"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    {name = "Thomas Williams", email = "thomas.g.williams@manchester.ac.uk"},
]
maintainers = [
    {name = "Thomas Williams", email = "thomas.g.williams@manchester.ac.uk"},
]

classifiers = [
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "astropy >= 7.2.0",
    "numpy >= 2.3.5",
    "radio-beam >= 0.3.9",
    "spectral-cube >= 0.6.7",
]

# Optional packages for the test suite
[project.optional-dependencies]
test = [
    "pytest >= 9.0",
    "pytest-cov >= 7.1.0",
]
test-ruff = [
    "ruff >= 0.15.10",
]
test-mypy = [
    "mypy >= 1.19",
]

# Optional packages for documentation
docs = [
    "myst-parser >= 5.1.0",
    "sphinx >= 9.1.0",
    "sphinx-automodapi >= 0.22.0",
    "sphinx-rtd-theme >= 3.1.0",
]

[project.urls]
"Homepage" = "https://github.com/thomaswilliamsastro/convolve_uv"
"Bug Reports" = "https://github.com/thomaswilliamsastro/convolve_uv/issues"
"Source" = "https://github.com/thomaswilliamsastro/convolve_uv"

[build-system]
requires = [
    # 77 is the first release that supports PEP 639 license expressions
    "setuptools >= 77.0.1",
    "setuptools_scm >= 8.0",
]

build-backend = "setuptools.build_meta"

[tool.setuptools]
# Without this, setuptools_scm's file finder adds every tracked file under convolve_uv/
# (including the tests) back in as package data, so the data files are listed explicitly.
include-package-data = false

[tool.setuptools.package-data]
# Marks the package as typed for type checkers that use its inline annotations (PEP 561)
convolve_uv = ["py.typed"]

[tool.setuptools.packages.find]
# Ship only the package itself; the tests stay in the sdist (and the repository).
include = ["convolve_uv*"]
exclude = ["convolve_uv.tests*"]
namespaces = false

[tool.mypy]
# The oldest supported Python version
python_version = "3.12"
files = ["convolve_uv"]
strict = true

[[tool.mypy.overrides]]
# These dependencies ship no type information
module = ["astropy.*", "radio_beam.*", "spectral_cube.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tests are type checked, but not every test function needs annotations
module = ["convolve_uv.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.setuptools_scm]
# Used when no git metadata is available (e.g. building from a GitHub source archive).
fallback_version = "0.0.0+unknown"
